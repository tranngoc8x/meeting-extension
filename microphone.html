<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấp quyền micro · July</title>
  <link rel="stylesheet" href="recordings.css">
</head>
<body class="microphone-setup">
  <main>
    <p class="eyebrow">JULY MEETING</p>
    <h1 data-i18n="micHeading">Cấp quyền micro cho July</h1>
    <p class="intro" data-i18n="micIntro1">Chọn Cho phép trong thông báo Chrome để July ghi giọng của bạn cùng cuộc họp.</p>
    <button id="allow-microphone" class="download" type="button" data-i18n="micRetry" hidden>Thử lại</button>
    <p id="microphone-status" role="status" data-i18n="micWaiting">Đang chờ quyền micro…</p>
    <p id="error" role="alert"></p>
    <p class="intro" data-i18n="micIntro2">Ghi âm sẽ tự tiếp tục và cửa sổ này tự đóng.</p>
    <p class="intro" data-i18n="micIntro3">Bản ghi chỉ lấy tiếng micro. Khi tắt mic trên Meet, đoạn đó sẽ im lặng.</p>
  </main>
  <script type="module" src="microphone.js"></script>
</body>
</html>
